<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Water Game</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header class="hero">
    <h1>Move the bucket to collect the clean drops and avoid the polluted drops</h1>
    <div class="header-buttons">
      <a href="https://www.charitywater.org/donate" target="_blank" class="donate-btn">DONATE</a>
      <button class="restart-btn">RESTART</button>
    </div>
  </header>

  <!-- GAME AREA -->
  <section class="game-area">

    <!-- CLOUDS -->
    <img src="img/clouds.png" class="cloud c1" alt="cloud">
    <img src="img/clouds.png" class="cloud c2" alt="cloud">
    <img src="img/clouds.png" class="cloud c3" alt="cloud">
    <img src="img/clouds.png" class="cloud c4" alt="cloud">
    <img src="img/clouds.png" class="cloud c5" alt="cloud">
    <img src="img/clouds.png" class="cloud c6" alt="cloud">
    <img src="img/clouds.png" class="cloud c7" alt="cloud">
    <img src="img/clouds.png" class="cloud c8" alt="cloud">
    <img src="img/clouds.png" class="cloud c9" alt="cloud">
    <img src="img/clouds.png" class="cloud c10" alt="cloud">
    <img src="img/clouds.png" class="cloud c11" alt="cloud">
    <img src="img/clouds.png" class="cloud c12" alt="cloud">

    <!-- CLEAN DROPS (27) -->
    <img src="img/clean-drop.png" class="drop clean d1" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d2" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d3" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d4" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d5" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d6" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d7" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d8" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d9" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d10" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d11" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d12" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d13" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d14" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d15" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d16" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d17" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d18" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d19" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d20" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d21" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d22" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d23" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d24" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d25" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d26" alt="clean drop">
    <img src="img/clean-drop.png" class="drop clean d27" alt="clean drop">

    <!-- POLLUTED DROPS (20) -->
    <img src="img/polluted-drop.png" class="drop polluted p1" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p2" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p3" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p4" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p5" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p6" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p7" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p8" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p9" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p10" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p11" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p12" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p13" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p14" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p15" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p16" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p17" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p18" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p19" alt="polluted drop">
    <img src="img/polluted-drop.png" class="drop polluted p20" alt="polluted drop">

    <!-- BUCKET + SWIPE -->
    <div class="bucket-container">
      <img src="img/bucket.png" class="bucket" alt="bucket">
      <img src="img/swipe-finger.png" class="swipe" alt="swipe instruction">
    </div>

  </section>

  <!-- INFO BAR -->
  <footer class="info-bar">
    <div class="stats">
      <p>Time: <span id="time">25s</span></p>
      <p>Score: <span id="score">100</span></p>
      <p>Lives Remaining: <span id="lives">2/5</span></p>
    </div>
    <div class="brand">
      <img src="img/charity-water-logo.png" alt="charity water logo">
      <p>charity: water</p>
    </div>
  </footer>

</body>
</html>
